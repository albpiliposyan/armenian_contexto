[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armenian-contexto"
version = "0.1.0"
description = "Armenian semantic word guessing engine inspired by Contexto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deep-translator",
    "fasttext-wheel",
    "numpy",
    "spacy",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
